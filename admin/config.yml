# ─────────────────────────────────────────────────────────────────────
# Decap CMS configuration.
#
# Backend: GitHub sign-in handled by the site's own Worker
# (worker/cms-auth.js, setup in docs/admin-login.md).
#
# Local preview during development:
#   - run a static server from repo root (e.g. `npx serve .`)
#   - visit http://localhost:3000/admin/?local_backend=true
#   - run `npx decap-server` in another terminal (no auth, file-system writes)
# ─────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: Gloria-Qi0311/personal_website
  branch: main
  base_url: https://gloria-qi.glqi63583.workers.dev
  auth_endpoint: api/auth
  auth_scope: public_repo

# Allow `?local_backend=true` to use a filesystem proxy during dev.
local_backend: true

publish_mode: simple
media_folder: "media"
public_folder: "/media"

# ─────────────────────────────────────────────────────────────────────
# Collections — each maps to a JSON file or folder under /content.
# ─────────────────────────────────────────────────────────────────────
collections:
  # ── Site meta + footer ─────────────────────────────────────────────
  - name: "site"
    label: "Site meta"
    files:
      - file: "content/site.json"
        label: "Site"
        name: "site"
        format: "json"
        fields:
          - { label: "Title",       name: "meta.title",       widget: "string" }
          - { label: "Language",    name: "meta.lang",        widget: "string", default: "en" }
          - { label: "Description", name: "meta.description", widget: "text" }
          - { label: "Footer copyright",  name: "footer.copyright",  widget: "string" }
          - { label: "Footer tagline",    name: "footer.tagline",    widget: "string" }
          - { label: "Last updated (YYYY-MM-DD)", name: "footer.lastUpdated", widget: "string" }
          # ── Cloudflare Web Analytics ─────────────────────────────────
          # Get the token from dash.cloudflare.com → Web Analytics →
          # Add a site → copy the value from the data-cf-beacon JSON.
          # Leave empty to disable.
          - { label: "Cloudflare Analytics Token", name: "analytics.cfAnalyticsToken", widget: "string", required: false, hint: "From dash.cloudflare.com → Web Analytics. Empty = disabled." }
          # ── Giscus comments ──────────────────────────────────────────
          # Setup: enable Discussions on the GitHub repo, then visit
          # giscus.app, configure for Gloria-Qi0311/personal_website, and
          # paste the generated repo-id and category-id below.
          - { label: "Giscus repo (owner/name)", name: "giscus.repo",       widget: "string", required: false, default: "Gloria-Qi0311/personal_website" }
          - { label: "Giscus repo ID",           name: "giscus.repoId",     widget: "string", required: false, hint: "From giscus.app — empty = comments disabled" }
          - { label: "Giscus category",          name: "giscus.category",   widget: "string", required: false, default: "General" }
          - { label: "Giscus category ID",       name: "giscus.categoryId", widget: "string", required: false, hint: "From giscus.app" }
          - { label: "Giscus mapping",           name: "giscus.mapping",    widget: "select", options: ["pathname","url","title","og:title","specific","number"], required: false, default: "pathname" }
          - { label: "Giscus theme",             name: "giscus.theme",      widget: "select", options: ["light","dark","preferred_color_scheme"], required: false, default: "light" }
          - { label: "Giscus input position",    name: "giscus.inputPosition", widget: "select", options: ["top","bottom"], required: false, default: "top" }

  # ── Hero / profile ─────────────────────────────────────────────────
  - name: "profile"
    label: "Hero / profile"
    files:
      - file: "content/profile.json"
        label: "Profile"
        name: "profile"
        format: "json"
        fields:
          - { label: "Name",         name: "name",        widget: "string" }
          - { label: "Name accent",  name: "nameAccent",  widget: "string", required: false }
          - { label: "Role",         name: "role",        widget: "string" }
          - { label: "Location",     name: "location",    widget: "string" }
          - { label: "Status (now)", name: "status",      widget: "string" }
          - { label: "Slogan",       name: "slogan",      widget: "text" }
          - label: "Tags"
            name: "tags"
            widget: "list"
            field: { label: "Tag", name: "tag", widget: "string" }
          - label: "Audience CTAs (3 entries)"
            name: "ctas"
            widget: "list"
            min: 1
            max: 4
            fields:
              - { label: "Audience",  name: "audience", widget: "string" }
              - { label: "Label",     name: "label",    widget: "string" }
              - { label: "Anchor (#shipped, #now, #contact, …)", name: "anchor", widget: "string" }
              - { label: "Helper note", name: "note",   widget: "string", required: false }

  # ── Home page ──────────────────────────────────────────────────────
  - name: "home"
    label: "Home page"
    files:
      - file: "content/home.json"
        label: "Home"
        name: "home"
        format: "json"
        fields:
          - { label: "Greeting lines", name: "greeting", widget: "list", field: { label: "Line", name: "line", widget: "string" } }
          - { label: "Intro under the greeting", name: "intro", widget: "text" }
          - { label: "Suggested questions", name: "suggestions", widget: "list", field: { label: "Question", name: "q", widget: "string" } }
          - { label: "Chat box placeholder", name: "inputPlaceholder", widget: "string" }
          - { label: "Note under the chat box", name: "disclaimer", widget: "string" }
          - { label: "Name on the profile card", name: "profileName", widget: "string" }
          - { label: "Line on the profile card", name: "profileLine", widget: "string" }
          - { label: "Chinese name", name: "nameZh", widget: "string", required: false }
          - { label: "Photo (empty = avatar drawing)", name: "photo", widget: "image", required: false }
          - { label: "Roles", name: "roles", widget: "list", field: { label: "Role", name: "role", widget: "string" } }
          - label: "Résumé links"
            name: "resume"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link (empty = coming soon)", name: "href", widget: "string", required: false }
          - { label: "Now (what I'm working on)", name: "now", widget: "text", required: false }
          - label: "Projects"
            name: "projects"
            widget: "object"
            fields:
              - { label: "Featured card IDs (in order)", name: "featured", widget: "list", field: { label: "Card ID", name: "id", widget: "string" } }
          - label: "Skills"
            name: "skills"
            widget: "object"
            fields:
              - { label: "Note", name: "note", widget: "string", required: false }
              - label: "Groups"
                name: "groups"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Skills (match project tags to link projects)", name: "items", widget: "list", field: { label: "Skill", name: "skill", widget: "string" } }
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link (empty = coming soon)", name: "href", widget: "string", required: false }

  # ── Board: project cards ───────────────────────────────────────────
  - name: "board"
    label: "Board (Shipped/Now/Next/Later)"
    files:
      - file: "content/board.json"
        label: "Cards"
        name: "cards"
        format: "json"
        fields:
          - label: "Cards"
            name: "cards"
            widget: "list"
            summary: "{{fields.title}} · {{fields.status}}"
            fields:
              - { label: "ID (slug)", name: "id",      widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["shipped", "now", "next", "later"]
              - { label: "Title",     name: "title",   widget: "string" }
              - { label: "Summary",   name: "summary", widget: "text" }
              - { label: "Details (markdown — supports ## h2, lists, **bold**, `code`)", name: "details", widget: "text", required: false }
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
              - { label: "Impact",    name: "impact",  widget: "string", required: false }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL",   name: "href",  widget: "string" }
              - { label: "Updated (YYYY-MM-DD)", name: "updated", widget: "string" }
              - { label: "Order within column", name: "order", widget: "number", default: 1 }
              - { label: "Specimen name (Latin-ish, shown under the title)", name: "specimen", widget: "string", required: false }
              - label: "Home card fields"
                name: "fields"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "text" }

  # ── Lens: principles ───────────────────────────────────────────────
  - name: "lens"
    label: "Lens (how I think)"
    files:
      - file: "content/lens.json"
        label: "Lens"
        name: "lens"
        format: "json"
        fields:
          - label: "Section header"
            name: "head"
            widget: "object"
            fields:
              - { label: "Command", name: "cmd",   widget: "string" }
              - { label: "Title",   name: "title", widget: "string" }
              - { label: "Meta",    name: "meta",  widget: "string", required: false }
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.num}} {{fields.main}}"
            fields:
              - { label: "Number (e.g. / 01)", name: "num",   widget: "string" }
              - { label: "Main line",          name: "main",  widget: "string" }
              - { label: "Aside / nuance",     name: "aside", widget: "string" }

  # ── Contact ────────────────────────────────────────────────────────
  - name: "contact"
    label: "Contact"
    files:
      - file: "content/contact.json"
        label: "Contact"
        name: "contact"
        format: "json"
        fields:
          - label: "Section header"
            name: "head"
            widget: "object"
            fields:
              - { label: "Command", name: "cmd",   widget: "string" }
              - { label: "Title",   name: "title", widget: "string" }
              - { label: "Meta",    name: "meta",  widget: "string", required: false }
          - { label: "Intro (supports <em>/<strong>)", name: "intro", widget: "text" }
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.key}} · {{fields.label}}"
            fields:
              - { label: "Key (email / linkedin / …)", name: "key",   widget: "string" }
              - { label: "Display label", name: "label", widget: "string" }
              - { label: "URL",           name: "href",  widget: "string" }

  # ── Chat assistant rules ───────────────────────────────────────────
  # Read by the chat (worker/agent.js). Keep each rule to one short
  # sentence: the small model follows a few short rules better than many.
  - name: "agent"
    label: "Chat assistant"
    files:
      - file: "content/agent.json"
        label: "Chat assistant rules"
        name: "agent"
        format: "json"
        fields:
          - { label: "Always do", name: "must", widget: "list", required: false, field: { label: "Rule", name: "rule", widget: "string" } }
          - { label: "Never do", name: "mustNot", widget: "list", required: false, field: { label: "Rule", name: "rule", widget: "string" } }
          - { label: "Tone", name: "tone", widget: "list", required: false, field: { label: "Rule", name: "rule", widget: "string" } }
          - label: "Topics to decline"
            name: "avoid"
            widget: "list"
            required: false
            summary: "{{fields.topic}}"
            fields:
              - { label: "Topic", name: "topic", widget: "string" }
              - { label: "What to say instead", name: "reply", widget: "string", required: false }
          - label: "Fixed answers (sent as written, without the model)"
            name: "faq"
            widget: "list"
            required: false
            summary: "{{fields.question}}"
            fields:
              - { label: "Question (for your reference)", name: "question", widget: "string" }
              - { label: "Trigger words (any one in the question)", name: "keywords", widget: "list", field: { label: "Word", name: "word", widget: "string" } }
              - { label: "Answer", name: "answer", widget: "markdown" }
              - { label: "Answer in Chinese (optional)", name: "answerZh", widget: "markdown", required: false }
